[project]
name = "whatsapp-mcp-server"
version = "0.7.0"
description = "WhatsApp integration for Claude via Model Context Protocol (MCP)"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "Very Good Plugins", email = "support@verygoodplugins.com" }
]
keywords = ["whatsapp", "mcp", "claude", "ai", "messaging"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    # The restricted profile requires patched crypto dependencies.
    "cryptography>=50.0.0,<51",
    "pyjwt>=2.15.0",
    "urllib3>=2.8.0",
    "pygments>=2.20.0",
    "python-dotenv>=1.2.2",
    "httpx>=0.28.1",
    "mcp[cli]>=1.28.1,<2",
    "requests>=2.34.2",
    # Require the patched release for installs that do not use uv.lock.
    "anyio>=4.14.2,<4.15",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.15",
]

[project.urls]
Homepage = "https://github.com/verygoodplugins/whatsapp-mcp"
Repository = "https://github.com/verygoodplugins/whatsapp-mcp"
Issues = "https://github.com/verygoodplugins/whatsapp-mcp/issues"

[tool.setuptools]
py-modules = ["main", "whatsapp", "audio", "mcp_config", "parent_watchdog", "transcription", "media_preview", "owner_policy", "readonly_main"]

[tool.mcp]
name = "io.github.verygoodplugins/whatsapp-mcp"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "W",   # pycodestyle warnings
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
